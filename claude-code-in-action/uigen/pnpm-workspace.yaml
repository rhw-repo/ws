minimumReleaseAge: 5760
blockExoticSubdeps: true
trustPolicy: no-downgrade

allowBuilds:
  "@prisma/client": true
  "@prisma/engines": true
  bcrypt: true
  esbuild: true
  prisma: true
  sharp: true
  unrs-resolver: true

overrides:
  "next": ">=15.5.24"
  "undici-types": ">=6.28.1"
  "eslint-import-resolver-typescript": ">=4.4.5"
  "semver": ">=7.7.3"
  "chokidar": "5.0.0"
  "eslint": "10.9.1"
